<nav class="site-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <ul class="nav-links">
      {% for link in site.nav_links %}
      <li>
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} class="active"{% endif %}>
          {{ link.title }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</nav>
